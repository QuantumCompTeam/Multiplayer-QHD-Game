[project]
name = "entangled-equilibria"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "qiskit==1.3.2",
    "qiskit-aer==0.14.2",
    "nashpy==0.0.19",
    "networkx==3.3",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "matplotlib==3.9.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I"]
